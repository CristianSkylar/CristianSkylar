<g fill="#eee8dc" font-family="Georgia, Times New Roman, serif" font-size="28"><text x="35" y="99">Experiencias web.</text><text x="375" y="99">Marcas con voz.</text><text x="699" y="99" font-size="24">Ideas en movimiento.</text></g>
<g fill="#c2b5a8" font-family="Arial, Helvetica, sans-serif" font-size="14"><text x="35" y="136">Diseño, desarrollo y animación.</text><text x="35" y="159">De una idea a algo que puedes usar.</text><text x="375" y="136">Marca personal, presencia digital</text><text x="375" y="159">y contenido para redes sociales.</text><text x="699" y="136">Multimedia, audiovisual, música</text><text x="699" y="159">y proyectos propios.</text></g>
<g fill="#9f846c" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="1.5"><text x="35" y="196">DISEÑAR · CONSTRUIR</text><text x="375" y="196">CONECTAR · COMUNICAR</text><text x="699" y="196">EXPLORAR · CREAR</text></g>
